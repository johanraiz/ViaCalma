<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ViaCalma</title>
<!-- PWA (v1.78) : manifeste + icônes pour l'installation sur l'écran d'accueil, couleur de thème
     alignée sur --bg (claire) et sa variante sombre (deux balises theme-color avec `media`, prises
     en charge par les navigateurs récents — pas besoin de JS pour basculer selon le mode du
     téléphone). Cf. cahier des charges v1.78 : icônes encore en attente d'un visuel fourni par
     Johan, manifest.json les référence déjà pour que rien ne soit à retoucher une fois reçues. -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#f5e8cd" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1a201c" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ViaCalma">
<!-- Polices (v1.65) : Fredoka pour les titres, Nunito Sans pour le corps de texte — remplacent la
     police système par défaut, jugée trop sérieuse par des retours utilisateurs. Cf. cahier des
     charges v1.65 pour la comparaison ayant mené à ce choix. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css?v=5542792e">
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<!-- v1.104 : bandeau "nouvelle version disponible" — à la demande de Johan, après avoir expliqué
     qu'un commit GitHub Pages ne se répercute pas tout seul sur l'app déjà installée chez un
     testeur (le service worker sert la version en cache tant qu'on ne recharge pas). Masqué par
     défaut (hidden), affiché uniquement quand une vraie mise à jour est détectée (cf. script
     ci-dessous) — jamais au tout premier lancement. -->

<div id="updateBanner" class="update-banner" hidden role="status" aria-live="polite">
  <span class="update-banner-txt">Nouvelle version disponible</span>
  <button type="button" id="updateReloadBtn" class="update-banner-btn">Recharger</button>
  <button type="button" id="updateDismissBtn" class="update-banner-dismiss" aria-label="Fermer ce message">✕</button>
</div>
<script>
  // Service worker (v1.78) : présent seulement dans dist/ (généré par build.py, cf. commentaire
  // dédié dans ce fichier) — absent de app/ pendant le développement, pour ne jamais gêner
  // l'itération rapide avec du contenu mis en cache. L'échec silencieux (.catch) est donc normal et
  // attendu ici, pas une erreur : sw.js n'existe simplement pas dans ce dossier.
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    });

    // v1.104 : sw.js (cf. build.py) appelle déjà self.skipWaiting()/self.clients.claim() sans
    // attendre de confirmation de la page — la nouvelle version s'active donc toute seule dès que
    // le navigateur l'a détectée et installée en arrière-plan (généralement à la prochaine ouverture
    // de l'app avec une connexion). "controllerchange" est l'évènement qui signale exactement ce
    // moment-là : le service worker qui contrôle cette page vient de changer. On ignore le tout
    // premier déclenchement (celui de l'installation initiale, où il n'y avait pas encore de
    // contrôleur avant) pour ne montrer le bandeau que lors d'une vraie mise à jour, jamais au
    // premier lancement de l'app.
    let hadController = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.addEventListener("controllerchange", () => {
      if (hadController && window.showUpdateBanner) window.showUpdateBanner();
      hadController = true;
    });
  }

  // v1.104 : le bandeau est en position fixe (cf. app.css) pour rester visible même si l'écran du
  // dessous défile, mais un élément fixe ne pousse rien dans le flux normal de la page — sans ce
  // correctif, il se superposerait au haut de l'écran en cours (bouton retour, vue grille/liste,
  // etc.) au lieu de le décaler. On mesure sa hauteur réelle une fois affiché (elle varie selon
  // l'encoche/la barre de statut du téléphone, cf. env(safe-area-inset-top) dans app.css) et on
  // l'applique en padding-top sur #app pour repousser tout le contenu d'autant.
  document.addEventListener("DOMContentLoaded", () => {
    const banner = document.getElementById("updateBanner");
    const appEl = document.getElementById("app");
    const reloadBtn = document.getElementById("updateReloadBtn");
    const dismissBtn = document.getElementById("updateDismissBtn");
    window.showUpdateBanner = () => {
      if (!banner) return;
      banner.hidden = false;
      if (appEl) appEl.style.paddingTop = banner.offsetHeight + "px";
    };
    window.hideUpdateBanner = () => {
      if (!banner) return;
      banner.hidden = true;
      if (appEl) appEl.style.paddingTop = "";
    };
    if (reloadBtn) reloadBtn.addEventListener("click", () => window.location.reload());
    if (dismissBtn) dismissBtn.addEventListener("click", () => window.hideUpdateBanner());
  });
</script>
<script src="js/bundle.551ac6a0.js"></script>
</body>
</html>
